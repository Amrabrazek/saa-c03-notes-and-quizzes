<svg viewBox="0 0 720 410" role="img" aria-label="Decision tree: non-HTTP or static IPs or no-DNS failover means Global Accelerator; caching or global HTTP means CloudFront; otherwise a Route 53 routing policy" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker>
  </defs>
  <!-- questions -->
  <rect x="20" y="20" width="390" height="56" rx="8" class="dg-box"/>
  <text x="215" y="53" text-anchor="middle" class="dg-t">Is the traffic HTTP or HTTPS?</text>
  <rect x="20" y="120" width="390" height="56" rx="8" class="dg-box"/>
  <text x="215" y="144" text-anchor="middle" class="dg-t">Need static IPs, or failover</text>
  <text x="215" y="163" text-anchor="middle" class="dg-t">with no DNS delay?</text>
  <rect x="20" y="220" width="390" height="56" rx="8" class="dg-box"/>
  <text x="215" y="244" text-anchor="middle" class="dg-t">Need caching, or faster HTTP</text>
  <text x="215" y="263" text-anchor="middle" class="dg-t">for global users (even dynamic)?</text>
  <rect x="20" y="320" width="390" height="62" rx="8" class="dg-box"/>
  <text x="215" y="345" text-anchor="middle" class="dg-t">Route 53 routing policy</text>
  <text x="215" y="366" text-anchor="middle" class="dg-s">country, weight, latency, failover at DNS level</text>
  <!-- answers -->
  <rect x="480" y="20" width="220" height="56" rx="8" class="dg-acc2"/>
  <text x="590" y="44" text-anchor="middle" class="dg-t">Global Accelerator</text>
  <text x="590" y="63" text-anchor="middle" class="dg-s">gaming, VoIP, IoT, MQTT</text>
  <rect x="480" y="120" width="220" height="56" rx="8" class="dg-acc2"/>
  <text x="590" y="144" text-anchor="middle" class="dg-t">Global Accelerator</text>
  <text x="590" y="163" text-anchor="middle" class="dg-s">2 anycast IPs, fast failover</text>
  <rect x="480" y="220" width="220" height="56" rx="8" class="dg-acc"/>
  <text x="590" y="244" text-anchor="middle" class="dg-t">CloudFront</text>
  <text x="590" y="263" text-anchor="middle" class="dg-s">cache + edge TLS, TTL 0 is fine</text>
  <!-- edges -->
  <path d="M410 48H480" class="dg-l" marker-end="url(#dt-arrow)"/>
  <path d="M410 148H480" class="dg-l" marker-end="url(#dt-arrow)"/>
  <path d="M410 248H480" class="dg-l" marker-end="url(#dt-arrow)"/>
  <path d="M215 76V120" class="dg-l" marker-end="url(#dt-arrow)"/>
  <path d="M215 176V220" class="dg-l" marker-end="url(#dt-arrow)"/>
  <path d="M215 276V320" class="dg-l" marker-end="url(#dt-arrow)"/>
  <text x="445" y="40" text-anchor="middle" class="dg-s">no</text>
  <text x="445" y="140" text-anchor="middle" class="dg-s">yes</text>
  <text x="445" y="240" text-anchor="middle" class="dg-s">yes</text>
  <text x="225" y="103" class="dg-s">yes</text>
  <text x="225" y="203" class="dg-s">no</text>
  <text x="225" y="303" class="dg-s">no</text>
  <text x="480" y="345" class="dg-s">They stack: Route 53 → CloudFront → ALB</text>
  <text x="480" y="363" class="dg-s">is a normal, correct answer.</text>
</svg>
