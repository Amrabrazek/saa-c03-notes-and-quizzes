<svg viewBox="0 0 1000 560" role="img" aria-label="What lives where, as nested boxes. Global, not in any region: Route 53, CloudFront, Global Accelerator, IAM, Organizations, and WAF when attached to CloudFront. Regional and outside any VPC: S3, DynamoDB, Lambda, SQS, SNS, KMS, Secrets Manager, CloudWatch, API Gateway. Regional inside a VPC, spanning AZs: ALB, NLB, Auto Scaling group, EFS with a mount target per AZ, and RDS Multi-AZ as a pair. Inside one AZ: a subnet, an EC2 instance, an EBS volume, a NAT gateway, and a single RDS instance." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker>
  </defs>
