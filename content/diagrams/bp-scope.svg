  <text x="894" y="71" text-anchor="middle" class="dg-t">WAF on CloudFront</text>
  <rect x="30" y="104" width="940" height="430" rx="12" class="dg-box" style="fill:none"/>
  <text x="44" y="128" class="dg-t">REGION (e.g. us-east-1)</text>
  <text x="50" y="152" class="dg-s">Outside any VPC: you reach it by public endpoint or VPC endpoint</text>
