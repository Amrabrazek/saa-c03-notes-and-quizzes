  <text x="24" y="34" class="dg-t">GLOBAL</text>
  <rect x="30" y="46" width="148" height="40" rx="8" class="dg-acc"/>
  <text x="104" y="71" text-anchor="middle" class="dg-t">Route 53</text>
  <rect x="188" y="46" width="148" height="40" rx="8" class="dg-acc"/>
  <text x="262" y="71" text-anchor="middle" class="dg-t">CloudFront</text>
