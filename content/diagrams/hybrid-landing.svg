<svg viewBox="0 0 720 400" role="img" aria-label="On-premises connects to AWS by Site-to-Site VPN over the internet or by Direct Connect through a DX location. A VPN lands on a virtual private gateway for one VPC or a Transit Gateway for many VPCs. Direct Connect uses a private VIF to a VGW, or a Direct Connect Gateway to reach VPCs in many regions, with a transit VIF to Transit Gateways." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="hl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-head"/></marker>
  </defs>
  <!-- on-prem -->
  <rect x="16" y="150" width="130" height="80" rx="10" class="dg-box"/>
  <text x="81" y="180" text-anchor="middle" class="dg-t">On-premises</text>
  <text x="81" y="200" text-anchor="middle" class="dg-s">router =</text>
  <text x="81" y="216" text-anchor="middle" class="dg-s">customer gateway</text>
  <!-- paths -->
  <rect x="200" y="60" width="190" height="62" rx="10" class="dg-acc2"/>
  <text x="295" y="86" text-anchor="middle" class="dg-t">Site-to-Site VPN</text>
  <text x="295" y="106" text-anchor="middle" class="dg-s">internet · IPsec · hours</text>
  <rect x="200" y="252" width="190" height="74" rx="10" class="dg-acc"/>
  <text x="295" y="284" text-anchor="middle" class="dg-t">Direct Connect</text>
  <text x="295" y="302" text-anchor="middle" class="dg-s">private line · weeks to set up</text>
  <text x="295" y="318" text-anchor="middle" class="dg-s">NOT encrypted</text>
  <path d="M146 175Q170 100 200 92" class="dg-l" marker-end="url(#hl-arrow)"/>
  <path d="M146 205Q170 280 200 289" class="dg-l" marker-end="url(#hl-arrow)"/>
  <!-- landings -->
  <rect x="470" y="20" width="230" height="58" rx="10" class="dg-box"/>
  <text x="585" y="44" text-anchor="middle" class="dg-t">Virtual private gateway</text>
  <text x="585" y="64" text-anchor="middle" class="dg-s">ONE VPC</text>
  <rect x="470" y="130" width="230" height="58" rx="10" class="dg-box"/>
  <text x="585" y="154" text-anchor="middle" class="dg-t">Transit Gateway</text>
  <text x="585" y="174" text-anchor="middle" class="dg-s">MANY VPCs in a region</text>
  <rect x="470" y="250" width="230" height="78" rx="10" class="dg-acc"/>
  <text x="585" y="274" text-anchor="middle" class="dg-t">Direct Connect Gateway</text>
  <text x="585" y="294" text-anchor="middle" class="dg-s">VPCs in MANY regions</text>
  <text x="585" y="312" text-anchor="middle" class="dg-s">global, DX only</text>
  <path d="M390 82Q430 60 470 52" class="dg-l" marker-end="url(#hl-arrow)"/>
  <path d="M390 98Q430 140 470 155" class="dg-l" marker-end="url(#hl-arrow)"/>
  <path d="M390 280Q430 90 470 60" class="dg-l dg-dashl" marker-end="url(#hl-arrow)"/>
  <text x="420" y="214" class="dg-s">private VIF</text>
  <path d="M390 289H470" class="dg-l" marker-end="url(#hl-arrow)"/>
  <path d="M585 250V188" class="dg-l" marker-end="url(#hl-arrow)"/>
  <text x="595" y="226" class="dg-s">transit VIF → TGW</text>
  <text x="200" y="360" class="dg-s">Need encryption on DX? Run a Site-to-Site VPN over it (or MACsec on dedicated 10/100G).</text>
  <text x="200" y="380" class="dg-s">Need HA? 2 DX at 2 locations, or DX + VPN as the cheaper backup.</text>
</svg>
